# hausdorff.toml — empirical, machine-tunable parameters for hausdorff.
#
# These values are arbitrary in the sense that they trade off costs that depend
# on the target CPU (cache sizes, branch costs, allocation speed), so the right
# values differ per machine. The defaults below are reasonable for a typical
# x86-64 host. To override, copy this file, edit it, and point the environment
# variable `HAUSDORFF_CONFIG` at the copy — the bundled defaults fill in anything
# the override omits.

# Relative cost weights for the brute-vs-spatial-index dispatch in the planar
# minimum-distance kernel (`space::r2::min_distance`). The index path is chosen
# when its estimated cost
#     index_build_weight * m  +  index_query_weight * n * log2(m)
# is below the brute estimate `n * m` (and the operands' bounding boxes overlap).
# Only the *ratio* of these weights to the implicit brute weight of 1.0 matters.
[cost_model.min_distance]
index_build_weight = 6.0
index_query_weight = 6.0
# Segment-pair count (n*m) at or below which the brute scan skips per-pair
# bounding-box pruning and runs a tight unpruned O(n*m) loop — for small
# operands the prune bookkeeping costs more than it saves.
prune_pair_threshold = 256

# Default fan-out (items per node) of the STR-tree spatial index
# (`space::r2::StrTree`). Larger nodes give a shallower tree and fewer box tests
# but more work per node; the cache-optimal value is machine-dependent.
[index]
node_capacity = 16
