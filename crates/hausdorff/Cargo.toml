[package]
name = "hausdorff"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Internal geospatial primitives and index implementations for UrbanFabric. Façade over the hausdorff-* subcrates, preserving the original single-crate API."

[dependencies]
hausdorff-base = { workspace = true }
hausdorff-planar = { workspace = true }
hausdorff-sphere = { workspace = true }
hausdorff-index = { workspace = true }
hausdorff-earth = { workspace = true }
hausdorff-format = { workspace = true }
# Re-exported as `hausdorff::huygens` when the `profiling` feature is on so
# callers can drive collection (set `ProfileMode`, open a `PerfReport` root).
huygens = { workspace = true, optional = true }

[features]
# In-process profiling: hierarchical span timing of the kernels via huygens.
# Off by default and compile-time zero-cost when off; forwards to the
# instrumented subcrates.
profiling = ["dep:huygens", "hausdorff-planar/profiling"]

[dev-dependencies]
h3o = { workspace = true }
geographiclib-rs = { workspace = true }
geo = { workspace = true }
geo-types = { workspace = true }
geo-traits = { workspace = true }
geojson = { workspace = true }
geohash = { workspace = true }
wkb = { workspace = true }
wkt = { workspace = true }
# The relocated tests/ integration suite names the typed LengthMeters returned
# across the public API (e.g. RadialGrid construction).
euclid = { workspace = true }
# In-process benchmark harness (statistical per-call timing, TSC fast-clock,
# comparison tables) for benches/vs_external.rs.
huygens = { workspace = true }

# Wall-clock comparison of hausdorff's kernels against the external reference
# libraries (geo, h3o, geohash). Run: `cargo bench --bench vs_external`.
[[bench]]
name = "vs_external"
harness = false

# Hierarchical span profile of the instrumented kernels (needs the profiling
# feature). Run: `cargo run --release --example profile_kernels --features profiling`.
[[example]]
name = "profile_kernels"
required-features = ["profiling"]

[lints]
workspace = true
