[package]
name = "hausdorff"
version = "0.1.0"
edition = "2024"
license = "Proprietary"
authors = ["Raymond Mead"]
description = "Internal geospatial primitives and index implementations for UrbanFabric."

[dependencies]
# Backing the canonical GeoPoint/FixedGeoPoint newtypes (POD layout + JSON).
bytemuck = { version = "1.25", features = ["derive"] }
# Bundled-TOML config loader (the `hausdorff.toml` tuning parameters).
cavalieri = { git = "ssh://git@github.com/urban-fabric/cavalieri.git", branch = "main" }
euclid = { git = "ssh://git@github.com/urban-fabric/euclid.git", branch = "main" }
serde = { version = "1", features = ["derive"] }
# Generic JSON layer for the native GeoJSON codec (r2_format::geojson) — not a
# geo crate; replaces the `geojson` crate's JSON handling.
serde_json = "1"
# Optional: data-parallel execution of the batch (SoA) kernels, gated behind the
# `parallel` feature (off by default). The scalar path is the reference.
rayon = { version = "1.12", optional = true }

# No external geometry crate is a runtime dependency: every kernel/codec is
# native. `geo`/`geo-types` appear only as dev-dependency conformance oracles.

[features]
# Run independent per-element batch kernels (distance fans, batch H3 encode) on
# rayon's thread pool instead of sequentially. Results are identical either way.
parallel = ["dep:rayon"]

[dev-dependencies]
h3o = "0.10.0"
# Reference oracles — used only to conformance-check the native kernels/codecs
# (the same role h3o plays for the H3 core). Never runtime dependencies.
geo = "0.33"
# `geo-types` is the bridge type for the conformance oracle (tests/common); it
# backs `geojson`'s `geo-types` feature too. Test-only — not a runtime dep.
geo-types = "0.7"
geo-traits = "0.3"
geojson = { version = "1.0", features = ["geo-types"] }
geohash = "0.13"
wkb = "0.9"
wkt = "0.14"
# Reference oracle for the ported planar/spherical algorithms — used only in
# tests to cross-check our in-house implementations (the same role h3o plays
# for the H3 core). Never a runtime dependency.
# Also needed by the relocated tests/ integration suite, which names the typed
# LengthMeters returned across the public API (e.g. RadialGrid construction).
euclid = { git = "ssh://git@github.com/urban-fabric/euclid.git", branch = "main" }

# Wall-clock comparison of hausdorff's kernels against the external reference
# libraries (geo, h3o, geohash). Run: `cargo bench --bench vs_external`.
[[bench]]
name = "vs_external"
harness = false
