[package]
name = "hausdorff"
version = "0.1.0"
edition = "2024"
license = "Proprietary"
authors = ["Raymond Mead"]
description = "Internal geospatial primitives and index implementations for UrbanFabric."

[dependencies]
# Backing the canonical GeoPoint/FixedGeoPoint newtypes (POD layout + JSON).
bytemuck = { version = "1.25", features = ["derive"] }
euclid = { git = "ssh://git@github.com/urban-fabric/euclid.git", branch = "main" }
serde = { version = "1", features = ["derive"] }
# Generic JSON layer for the native GeoJSON codec (r2_format::geojson) — not a
# geo crate; replaces the `geojson` crate's JSON handling.
serde_json = "1"
# The lightweight `geo-types` structs are kept as a runtime dependency only for
# the compat I/O bridge (to_geo_geometry / from_geo_geometry) at the WKB/shapefile
# edges. The heavy `geo` algorithm crate is NOT a runtime dependency — every
# kernel is native now; geo appears only as a dev-dependency oracle below.
geo-types = "0.7"

[dev-dependencies]
h3o = "0.10.0"
# Reference oracles — used only to conformance-check the native kernels/codecs
# (the same role h3o plays for the H3 core). Never runtime dependencies.
geo = "0.33"
geo-traits = "0.3"
geojson = { version = "1.0", features = ["geo-types"] }
geohash = "0.13"
wkb = "0.9"
wkt = "0.14"
# Reference oracle for the ported planar/spherical algorithms — used only in
# tests to cross-check our in-house implementations (the same role h3o plays
# for the H3 core). Never a runtime dependency.
# Also needed by the relocated tests/ integration suite, which names the typed
# LengthMeters returned across the public API (e.g. RadialGrid construction).
euclid = { git = "ssh://git@github.com/urban-fabric/euclid.git", branch = "main" }
