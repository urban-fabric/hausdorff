[workspace]
resolver = "3"
# hausdorff: urban-fabric's geometry and spatial indexing domain.
# Flat layout — every crate lives directly under crates/. The dependency DAG is
#   hausdorff-geometry-traits → hausdorff-base → hausdorff-planar →
#   {hausdorff-sphere, hausdorff-index, hausdorff-format} → hausdorff-earth →
#   hausdorff (the façade),
# cut so that thin consumers (GeoPoint / haversine / BBox) can depend on
# hausdorff-base alone while the `hausdorff` façade preserves the original
# single-crate public API unchanged. hausdorff-geometry-traits is the abstract
# geometry-trait surface (Orientation / VectorSpace / Simplex / Interpolate /
# PointRegion), upstream of every space so even the r1/s1/r3 substrates in
# hausdorff-base implement it for their own types.
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Proprietary"
authors = ["Raymond Mead"]
repository = "https://github.com/urban-fabric/hausdorff"
rust-version = "1.95"

[workspace.dependencies]
# Internal crates (path deps within the workspace; consumers in sibling repos
# reach them through this repo's git URL with the package name they need).
hausdorff-geometry-traits = { path = "crates/hausdorff-geometry-traits" }
hausdorff-base = { path = "crates/hausdorff-base" }
hausdorff-planar = { path = "crates/hausdorff-planar" }
hausdorff-sphere = { path = "crates/hausdorff-sphere" }
hausdorff-index = { path = "crates/hausdorff-index" }
hausdorff-earth = { path = "crates/hausdorff-earth" }
hausdorff-format = { path = "crates/hausdorff-format" }

# Urban fabric sibling repositories.
# Bundled-TOML config loader (the `hausdorff.toml` tuning parameters).
cavalieri = { git = "ssh://git@github.com/urban-fabric/cavalieri.git", branch = "main" }
euclid = { git = "ssh://git@github.com/urban-fabric/euclid.git", branch = "main" }
# Optional: in-process profiling (hierarchical span timing of the kernels),
# gated behind the `profiling` feature (off by default). When the feature is
# off the span hooks compile to nothing, so normal builds carry zero profiling
# overhead.
huygens = { git = "ssh://git@github.com/urban-fabric/huygens.git", branch = "main" }

# External crates.
# Backing the canonical GeoPoint/FixedGeoPoint newtypes (POD layout + JSON).
bytemuck = { version = "1.25", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
# Generic JSON layer for the native GeoJSON codec (format::geojson) — not a
# geo crate; replaces the `geojson` crate's JSON handling.
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(euler_extract)"] }

# Dev-only redirect to the euclid worktree carrying `numeric::RealScalar` (the
# real-analysis trait the geometry generalizes over) during the coordinated
# foundation-consolidation branch work. Ignored when hausdorff is consumed as a
# dependency; re-pin to a merged commit before merge.
[patch."ssh://git@github.com/urban-fabric/euclid.git"]
euclid = { path = "../euclid-project" }
